<div class="page-header">
  <div>
    <a class="back-link" routerLink="/battery-modules">← Back to battery modules</a>
    <h2>{{ isEditMode ? 'Edit Battery Module' : 'Add Battery Module' }}</h2>
  </div>
  @if (isEditMode && moduleId) {
    <app-asset-links assetType="battery_module" [assetId]="moduleId" [name]="savedName" [packId]="savedPackId" />
  }
</div>

<div class="card">
  @if (loading) {
    <div class="empty-state">Loading…</div>
  } @else {
    <form [formGroup]="form" (ngSubmit)="submit()">
      @if (error) {
        <div class="form-error">{{ error }}</div>
      }

      <div class="form-grid">
        <div class="field">
          <label for="pack_id">Battery Pack *</label>
          <select id="pack_id" formControlName="pack_id">
            <option [ngValue]="null" disabled>Select a battery pack</option>
            @for (pack of packs; track pack.pack_id) {
              <option [ngValue]="pack.pack_id">{{ pack.pack_number || 'Pack ' + pack.pack_id }}</option>
            }
          </select>
          @if (form.get('pack_id')?.invalid && form.get('pack_id')?.touched) {
            <span class="field-error">Battery pack is required.</span>
          }
        </div>

        <div class="field">
          <label for="serial_number">Serial Number</label>
          <input id="serial_number" type="text" formControlName="serial_number" />
        </div>

        <div class="field">
          <label for="chemistry">Chemistry</label>
          <input id="chemistry" type="text" formControlName="chemistry" placeholder="e.g. LFP" />
        </div>

        <div class="field">
          <label for="nominal_voltage">Nominal Voltage</label>
          <input id="nominal_voltage" type="number" step="0.01" formControlName="nominal_voltage" />
        </div>

        <div class="field">
          <label for="capacity_ah">Capacity (Ah)</label>
          <input id="capacity_ah" type="number" step="0.01" formControlName="capacity_ah" />
        </div>

        <div class="field">
          <label for="manufacture_date">Manufacture Date</label>
          <input id="manufacture_date" type="date" formControlName="manufacture_date" />
        </div>

        <div class="field">
          <label for="installation_date">Installation Date</label>
          <input id="installation_date" type="date" formControlName="installation_date" />
        </div>

        <div class="field">
          <label for="status">Status</label>
          <input id="status" type="text" formControlName="status" placeholder="e.g. Active" />
        </div>

        <div class="field">
          <label for="cell_count">Cell Count</label>
          <input id="cell_count" type="number" formControlName="cell_count" min="0" step="1" />
        </div>

        <div class="field">
          <label for="soh_pct">SOH (%)</label>
          <input id="soh_pct" type="number" formControlName="soh_pct" min="0" max="100" step="0.01" />
        </div>
      </div>

      <div class="form-actions">
        <a class="btn btn-secondary" routerLink="/battery-modules">Cancel</a>
        <button type="submit" class="btn btn-primary" [disabled]="saving">
          {{ saving ? 'Saving…' : 'Save Module' }}
        </button>
      </div>
    </form>
  }
</div>
