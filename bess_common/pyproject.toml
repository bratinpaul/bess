[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bess-common"
version = "0.1.0"
description = "Code shared by the BESS backend and ML service (JWT access tokens, RBAC dependencies, logging / observability)"
requires-python = ">=3.10"
dependencies = ["fastapi", "PyJWT[crypto]>=2.8", "python-json-logger>=3.2", "sqlalchemy>=2.0"]

[tool.setuptools]
packages = ["bess_common"]
